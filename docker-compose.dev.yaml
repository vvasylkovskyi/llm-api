services:
  db:
    container_name: postgresql-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "secret123"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"
    volumes:
      - /home/vvasylkovskyi/.iac-toolbox/postgresql/data:/var/lib/postgresql/data