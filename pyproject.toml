[project]
name = "llm-api"
version = "0.0.1"
description = "LLM API using FastAPI, OpenTelemetry and LiteLLM"
readme = "README.md"
authors = [
  { name = "Viktor Vasylkovskyi", email = "viktor.vasylkovskyi@gmail.com" }
]
maintainers = [
  { name = "Viktor Vasylkovskyi", email = "viktor.vasylkovskyi@gmail.com" }
]
license = { text = "MIT" }  # adjust if different
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.124.4",
    "uvicorn>=0.38.0",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "arize-phoenix-otel>=0.16.1",
    "litellm>=1.0.0",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.1.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/vvasylkovskyi/llm-api"
Repository = "https://github.com/vvasylkovskyi/llm-api"

[tool.poetry.group.dev.dependencies]
dependencies = [
  "pyright==1.1.374",
  "ruff==0.5.5"
]

[tool.ruff]
fix = true
line-length = 120
src = ["src", "tests"]
target-version = "py311"
exclude = [
  ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", ".pants.d",
  ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build",
  "buck-out", "build", "dist", "node_modules", "venv"
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.pyright]
exclude = ["**/__pycache__"]
ignore = []
include = ["llm_api"]
strict = []
venvPath = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownParameterType = true
reportUntypedFunctionDecorator = true
