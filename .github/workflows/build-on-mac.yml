name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_docker_image:
    runs-on: [self-hosted, Mac]
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Container Image
        run: |
          TAG=${{ github.sha }}
          docker build -f ./Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/vvasylkovskyi-llm-api:$TAG .
          docker push ${{ secrets.DOCKER_USERNAME }}/vvasylkovskyi-llm-api:$TAG

      - name: Set output tag
        id: set_tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: [self-hosted, Mac]
    needs: build_docker_image
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Pull and deploy via Docker Compose
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/vvasylkovskyi-llm-api:${{ needs.build_docker_image.outputs.tag }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker compose down || true
          docker compose pull
          docker compose up -d

  migrate:
    runs-on: [self-hosted, Mac]
    needs: deploy
    env:
      DB_HOST: 100.95.50.80
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: mydb
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: uv sync

      - name: Run Alembic migrations
        run: uv run alembic -c llm_api/database/alembic.ini upgrade head
