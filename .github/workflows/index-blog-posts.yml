name: Index Blog Posts

on:
  workflow_dispatch:

jobs:
  index:
    runs-on: [self-hosted, Mac]
    env:
      DB_HOST: 100.95.50.80
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: mydb
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REMOTE_URL: https://github.com/vvasylkovskyi/vvasylkovskyi.github.io/tree/main/content/blog
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install blog_index dependencies
        run: uv sync

      - name: Index blog posts into database
        run: |
          cd blog_index && uv run python main.py \
            --remote-url "$GITHUB_REMOTE_URL" \
            --db
