[project]
name = "blog-index"
version = "0.1.0"
description = "Blog post indexer — fetches MDX posts from GitHub and stores them in PostgreSQL"
authors = [
  { name = "Viktor Vasylkovskyi", email = "viktor.vasylkovskyi@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "asyncpg>=0.29.0",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",
]
